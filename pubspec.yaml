name: masjid_app
description: "Smart Mosque Digital Signage Application - Feature-Based Clean Architecture with Cubit."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  video_player: ^2.10.1
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  intl: ^0.20.2
  marquee: ^2.2.3
  hijri: ^3.0.0
  audioplayers: ^5.2.1
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8
  auto_size_text: ^3.0.0
  wakelock_plus: ^1.4.0
  flutter_launcher_icons: ^0.14.4
  flutter_bloc: ^9.1.1

flutter_launcher_icons:
  android: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1a3a2a"
  adaptive_icon_foreground: "assets/images/app_icon.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/videos/
    - assets/jsons/
    - assets/jsons/prayer_times_.json
    - assets/jsons/iqama_times.json
    - assets/audios/
    - assets/icons/
    - assets/images/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800

    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
